<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunar Landing Site Navigator</title>
    <meta name="description" content="Compare landing sites at the lunar south pole by sunlight and line of sight to Earth, with real NASA terrain and ephemerides. NASA Space Apps 2026, team SpaceU." />
    <meta name="theme-color" content="#f7f8f9" />
    <meta name="color-scheme" content="only light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lunar Landing Site Navigator" />
    <meta property="og:description" content="Ten candidate sites at the lunar south pole: how long each stays lit and when Earth is in view, from NASA SPICE and LOLA terrain." />
    <meta property="og:image" content="https://evge14n.github.io/spaceu-lunar-navigator/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="./fonts/BarlowCondensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/IBMPlexSans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/IBMPlexMono-500.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // The map is the landing sheet: start fetching its picture before the app runs.
      if (location.hash === '' || location.hash.indexOf('#/map') === 0) {
        // the same candidates and sizes as the <img> on the map, so the browser preloads the file it will use
        var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = './layers/illumination.webp';
        l.setAttribute('imagesrcset', './layers/illumination-1024.webp 1024w, ./layers/illumination.webp 1772w');
        l.setAttribute('imagesizes', '(max-width: 700px) 100vw, 840px'); document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
